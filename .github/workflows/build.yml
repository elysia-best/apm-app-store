name: Build

on:
  push:
    branches: [main]
    tags:
      - "*"
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.spec.js"
      - ".idea"
      - ".vscode"
      - ".dockerignore"
      - "Dockerfile"
      - ".gitignore"
      - ".github/**"
      - "!.github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - package: deb
            architecture: x64
            os: ubuntu-latest
            docker_image: "node:20-bookworm"
            platform: linux/amd64
          - package: deb
            architecture: arm64
            os: ubuntu-latest
            docker_image: "node:20-bookworm"
            platform: linux/arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build in Docker
        run: |
            docker run --rm --privileged \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:${{ github.workspace }} \
            -w ${{ github.workspace }} \
            ${{ matrix.docker_image }} \
            /bin/bash -c "apt-get update && apt-get install -y curl git wget devscripts fakeroot equivs lintian python3 build-essential && \
            npm install && \
            if [ '${{ matrix.architecture }}' == 'x64' ]; then curl -fsSL -o ./extras/host-spawn https://github.com/1player/host-spawn/releases/latest/download/host-spawn-x86_64; else curl -fsSL -o ./extras/host-spawn https://github.com/1player/host-spawn/releases/latest/download/host-spawn-aarch64; fi && \
            chmod +x ./extras/host-spawn && \
            make generate-debian-changelog && \
            cp -r ./packaging/deb/debian ./debian && \
            mk-build-deps -i -r -t 'apt-get -y' && \
            dpkg-buildpackage -b -us -uc && \
            mkdir -p release/${{ matrix.package }} && \
            mv ../*.deb release/${{ matrix.package }}/ || true && \
            chown -R $(id -u):$(id -g) ."

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_for_${{ matrix.package }}_${{ matrix.architecture }}
          path: release/**/*.${{ matrix.package }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
          generate_release_notes: true